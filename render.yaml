# Live race server. Login stays off; this process only hosts /race-ws.
# After the first deploy, set Vercel RACE_WS_URL to
# wss://<this-service>.onrender.com/race-ws and redeploy the frontend.
# FRONTEND_URL should be the public site, for example https://your-app.vercel.app
services:
  - type: web
    name: typeai-race
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --global --prefix "$HOME/.local" pnpm@10.28.1 && export PATH="$HOME/.local/bin:$PATH" && NODE_ENV=development pnpm install --frozen-lockfile --ignore-scripts --filter @typeai/backend... && pnpm --filter @typeai/backend exec node scripts/emit-race-schema.cjs && pnpm --filter @typeai/backend build:race
    startCommand: NODE_PATH=backend/node_modules node backend/dist/race/standalone.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: FRONTEND_URL
        sync: false
