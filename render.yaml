# Live race server, typing coach, and the guest daily board.
# Login stays off. After the first deploy, set Vercel RACE_WS_URL to
# wss://<this-service>.onrender.com/race-ws and redeploy the frontend.
# FRONTEND_URL is optional when players open a *.vercel.app site.
# OPENAI_API_KEY turns on AI coach summaries.
# UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN store today's scores.
services:
  - type: web
    name: typeai-race
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --global --prefix "$HOME/.local" pnpm@10.28.1 && export PATH="$HOME/.local/bin:$PATH" && NODE_ENV=development pnpm install --frozen-lockfile --ignore-scripts --filter @typeai/backend... && pnpm --filter @typeai/backend exec node scripts/emit-race-schema.cjs && pnpm --filter @typeai/backend build:race
    startCommand: NODE_PATH=backend/node_modules node backend/dist/race/standalone.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
